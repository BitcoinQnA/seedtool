name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The tests and build.js only use Node's standard library and the
      # bundles committed in src/www/js/lib, so nothing is installed.
      - name: Tests
        run: npm test
      - name: dist/index.html matches the source
        run: |
          node build.js
          git diff --exit-code -- dist/index.html
