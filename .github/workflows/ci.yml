name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The tests load a few packages (QR and UR decoding, descriptors) from the
      # lockfile. Install scripts are not needed for the tests or build.js.
      - name: Install
        run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: dist/index.html matches the source
        run: |
          node build.js
          git diff --exit-code -- dist/index.html
